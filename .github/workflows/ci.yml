name: ci

on:
  push:
  pull_request:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen orchidee-jax --version
      - run: >-
          uv run --frozen pytest -q
          tests/unit/test_public_cli.py
          tests/unit/test_portable_config.py
          tests/unit/test_paper_landpoint_acceptance.py
          tests/unit/test_hydrol_diffuco_state_handoff.py::test_portable_fwet_diagnostic_survives_actual_carry
          tests/unit/test_canopy_component_local_jit.py::test_canopy_component_first_step_jit_matches_original_fortran
          tests/unit/test_ci_c50_energy_regression.py
          tests/unit/test_thermosoil_full_component_coef.py::test_actual_final_coefficient_call_matches_original_fortran
          tests/unit/test_snow_maxmass_domain.py::test_current_source_maxmass_all_locations_caps_ties_and_return_heat
          tests/unit/test_coupling_source_contract.py::test_nonzero_tuple_surftemp_flux_and_intersurf_rate_match_original_source
          tests/unit/test_coupling_source_contract.py::test_nonzero_A_is_consumed_and_rate_boundary_is_jittable
          tests/unit/test_coupling_source_contract.py::test_production_precall_adapter_passes_nonzero_tuple_to_actual_energy_solver
      - name: Custom soil parameters through HYDROL
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_hydrol_soil_parameter_contract.py
          tests/unit/test_hydrol_soil_parameter_callers.py
          tests/unit/test_hydrol_component_owner_closure.py::test_custom_soil_parameters_reach_real_wrapper_diagnostics
      - name: Parameter and state handoff interfaces
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_hydrol_depth_parameter_closeout.py
          tests/unit/test_parameter_state_creation_phases.py
          tests/unit/test_parameter_state_io_closeout.py
          tests/unit/test_parameter_state_scan_closeout.py
      - name: WATCHOUT forcing and restart transport
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_watchout_domain_transport.py
          tests/unit/test_watchout_drag_transport.py
          tests/unit/test_watchout_driver_transport.py
          tests/unit/test_watchout_paper_compiled_transport.py
          tests/unit/test_watchout_restart_transport.py
          tests/unit/test_watchout_forcing_repair.py
          tests/unit/test_watchout_run_context_repair.py
          tests/unit/test_watchout_context_handoff.py
      - name: Canopy and energy branch components
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_physics_branch_canopy.py
          tests/unit/test_physics_branch_energy.py
          tests/unit/test_physics_branch_coupling.py
      - name: Thermal and snow branch components
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_physics_branch_thermal.py
          tests/unit/test_thermosoil_source_conditions.py
          tests/unit/test_thermosoil_nslm.py::test_thermosoil_nslm_wrapper_jit_uses_original_traced_moisture_shape
      - name: Canopy energy and daily carbon source conditions
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase05_canopy_conditions.py
          tests/unit/test_phase05_energy_conditions.py
          tests/unit/test_phase05_daily_memory.py
          tests/unit/test_phase05_growth_conditions.py
          tests/unit/test_phase05_litter_soilcarbon.py
          tests/unit/test_phase05_component_writeback.py
      - name: Remaining physical arms and numerical joins
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase06_source_denominator.py
          tests/unit/test_phase06_growth_arithmetic.py
          tests/unit/test_phase06_daily_memory.py
          tests/unit/test_phase06_soilcarbon_diffusion.py
          tests/unit/test_phase06_canopy_predecessors.py
          tests/unit/test_phase06_energy_predecessors.py
          tests/unit/test_phase06_thermal_nested_return.py
          tests/unit/test_phase06_forcing_modelout.py
          tests/unit/test_phase06_native_partial.py
          tests/unit/test_phase06_routing_join.py
          tests/unit/test_phase06_carbon_join.py
          tests/unit/test_phase06_scientific_restart.py
      - name: Source condition and consumer references
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase07_source_disposition_components.py
      - name: Frozen soil bins and snow consumer references
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase08_hydrol_snow_consumers.py
      - name: Paper activity controls against original REAL8
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase09_paper_activity.py
      - name: DIFFUCO leaf CO2 restart state against original
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_phase10_diffuco_leaf_ci.py
      - name: Hydrology production configuration and tide adapters
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_physics_branch_hydrol.py
          tests/unit/test_physics_branch_handoff.py
          tests/unit/test_hydrol_check_cwrr_contract.py
          tests/unit/test_hydrol_tide_forcing.py
          tests/unit/test_hydrol_driver_controls.py
          tests/unit/test_hydrol_water_table_initialization.py
      - name: Water and thermal parameter receivers and restart fixtures
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: >-
          uv run --frozen python -B -m pytest -q -rs
          tests/unit/test_hydrol_module_step.py::test_hydrol_first_step_selects_texture_conductivity_when_points_equal_textures
          tests/unit/test_thermosoil_initialize.py::test_recomputed_restart_thermal_bedrock_capacity_follows_freeze_gate
          tests/unit/test_driver_snow_temperature_clamp.py
      - run: >-
          uv run --frozen ruff check
          jax_orchidee/cli
          jax_orchidee/runners
          jax_orchidee/runtime.py
          tests/unit/test_public_cli.py
          tests/unit/test_portable_config.py
          tests/unit/test_paper_landpoint_acceptance.py
          tests/unit/test_hydrol_diffuco_state_handoff.py
          tests/unit/test_canopy_component_local_jit.py
          tests/unit/test_ci_c50_energy_regression.py
          tests/unit/test_thermosoil_full_component_coef.py
          tests/unit/test_snow_maxmass_domain.py
          tests/unit/test_coupling_source_contract.py
          tests/unit/test_hydrol_soil_parameter_contract.py
          tests/unit/test_hydrol_soil_parameter_callers.py
          tests/unit/test_hydrol_component_owner_closure.py
          tests/unit/test_hydrol_depth_parameter_closeout.py
          tests/unit/test_parameter_state_creation_phases.py
          tests/unit/test_parameter_state_io_closeout.py
          tests/unit/test_parameter_state_scan_closeout.py
          tests/unit/test_watchout_domain_transport.py
          tests/unit/test_watchout_drag_transport.py
          tests/unit/test_watchout_driver_transport.py
          tests/unit/test_watchout_paper_compiled_transport.py
          tests/unit/test_watchout_restart_transport.py
          tests/unit/test_watchout_forcing_repair.py
          tests/unit/test_watchout_run_context_repair.py
          tests/unit/test_watchout_context_handoff.py
          tests/unit/test_physics_branch_canopy.py
          tests/unit/test_physics_branch_energy.py
          tests/unit/test_physics_branch_coupling.py
          tests/unit/test_physics_branch_hydrol.py
          tests/unit/test_physics_branch_thermal.py
          tests/unit/test_thermosoil_source_conditions.py
          tests/unit/test_thermosoil_nslm.py
          tests/unit/test_physics_branch_handoff.py
          tests/unit/test_hydrol_check_cwrr_contract.py
          tests/unit/test_hydrol_tide_forcing.py
          tests/unit/test_hydrol_driver_controls.py
          tests/unit/test_hydrol_water_table_initialization.py
          jax_orchidee/driver/tides.py
          scripts/dev/oracle_hydrol_tide_boundary.py
          scripts/dev/oracle_phase05_canopy_conditions.py
          scripts/dev/oracle_phase05_energy_conditions.py
          scripts/dev/oracle_phase05_daily_memory.py
          scripts/dev/oracle_phase05_growth_conditions.py
          scripts/dev/oracle_phase05_litter_soilcarbon.py
          tests/unit/test_phase05_canopy_conditions.py
          tests/unit/test_phase05_energy_conditions.py
          tests/unit/test_phase05_daily_memory.py
          tests/unit/test_phase05_growth_conditions.py
          tests/unit/test_phase05_litter_soilcarbon.py
          tests/unit/test_phase05_component_writeback.py
          scripts/dev/build_phase06_source_denominator.py
          scripts/dev/oracle_phase06_growth_arithmetic.py
          scripts/dev/oracle_phase06_daily_memory.py
          scripts/dev/oracle_phase06_soilcarbon_diffusion.py
          scripts/dev/oracle_phase06_canopy_predecessors.py
          scripts/dev/oracle_phase06_energy_predecessors.py
          scripts/dev/diagnose_phase06_thermal_nested_return.py
          scripts/dev/oracle_phase06_forcing_modelout.py
          scripts/dev/oracle_phase06_native_partial.py
          scripts/dev/audit_phase06_root_joins.py
          scripts/dev/oracle_phase06_scientific_restart.py
          tests/unit/test_phase06_source_denominator.py
          tests/unit/test_phase06_growth_arithmetic.py
          tests/unit/test_phase06_daily_memory.py
          tests/unit/test_phase06_soilcarbon_diffusion.py
          tests/unit/test_phase06_canopy_predecessors.py
          tests/unit/test_phase06_energy_predecessors.py
          tests/unit/test_phase06_thermal_nested_return.py
          tests/unit/test_phase06_forcing_modelout.py
          tests/unit/test_phase06_native_partial.py
          tests/unit/test_phase06_routing_join.py
          tests/unit/test_phase06_carbon_join.py
          tests/unit/test_phase06_scientific_restart.py
          tests/unit/test_phase07_source_disposition_components.py
          tests/unit/test_phase08_hydrol_snow_consumers.py
