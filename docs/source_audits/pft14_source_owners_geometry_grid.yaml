schema_version: 1
scope: >-
  Batch-2 source owners for the nine grid.f90 procedures and 70 reachable
  control-flow arms needed by independent landpoint and variable regular
  forcing-grid workflows. RegXY geometry is composed from the independently
  owned geometry_haversine and geometry_llxy numerical kernels with explicit
  projection and dx/dy inputs. MPI transport remains an infrastructure
  boundary; no scientific approximation is claimed for it.

entries:
