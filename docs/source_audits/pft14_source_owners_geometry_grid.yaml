    fortran_subroutine: grid_init
    fortran_lines: 207-328
    status: implemented
    jax_owner: jax_orchidee.driver.geometry_grid.grid_init
    gap: null
    arm_count: 32
    state_contract: [jax_orchidee.driver.geometry_grid.GridState]
    validation: [tests/unit/test_geometry_grid.py]

