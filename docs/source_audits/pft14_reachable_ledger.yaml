schema_version: 1
scope: >-
  Source-driven PFT14 reachable branch and carried-state ledger for the paper
  configuration. Reachability is not inferred from closure wording.
allowed_reachability: [active, conditional, inactive]
allowed_status: [verified, open, unsupported]
priority_modules: [DRIVER, SECHIBA, HYDROL, DIFFUCO, ENERBIL, THERMOSOIL, CONDVEG, SLOWPROC, ROUTING, STOMATE, RESTART, MODELOUT]
entries:
  - id: driver.active.forcing_landpoint_interpolation
    module: DRIVER
    fortran_file: fortran_source/ORCHIDEE/src_driver/readdim2.f90
    fortran_subroutine: forcing_read_interpol
    fortran_lines: 660-1687,1899-1968
    condition: >-
      Every paper half-hour for any independently selected landpoint; read the
      six-hour CRUNCEP fields in Fortran land order and apply the source time
      interpolation, precipitation conversion, and solar-angle split.
    reachability: active
    kernel: jax_orchidee.driver.domain.read_forcing_model_step_cached
    production_caller: jax_orchidee.driver.orchestration.paper_1961_driver_cold_start_multiday_modelout_lite_run
    state_inputs: [forcing_file, forcing_land_indices, model_tstep, dt_force, dt_sechiba, calendar, longitude, latitude]
    same_step_outputs: [temp_air, pb, qair, u, v, precip_rain, precip_snow, swdown, lwdown, zlev, zlevuv]
    next_step_restart_behavior: >-
      Forcing is external input rather than restart state. The driver advances
      the model timestep while preserving the same Fortran land-index mapping
      for every independent paper case and every later year.
    microcase:
      - tests/unit/test_driver_domain_multigrid.py::test_read_forcing_model_step_cached_handles_multiland_no_solar_split
      - tests/unit/test_driver_domain_multigrid.py::test_read_forcing_model_step_cached_handles_multiland_solarang_compression
    validation_evidence:
      - tests/parity/test_driver_1961_domain.py::test_1961_later_forcing_step_uses_same_fortran_land_point_mapping
      - tests/parity/test_driver_1961_server_trace_boundary.py::test_driver_first_forcing_domain_matches_server_trace_record
    status: verified

  - id: driver.active.salinity_bbox
    module: DRIVER
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/slowproc.f90
    fortran_subroutine: slowproc_read_annual
    fortran_lines: 6300-6570
    condition: >-
      Fixed READ_SALINITY=y; every independently selected landpoint maps to
      the annual salinity grid using the source bbox center-count mean and
      nearest fallback when the bbox is empty.
    reachability: active
    kernel: jax_orchidee.driver.static.read_paper_salinity_tide_static_fields
    production_caller: jax_orchidee.driver.orchestration.paper_1961_driver_cold_start_multiday_modelout_lite_run
    state_inputs: [landpoint_lalo, landpoint_resolution, salinity_file, salinity_grid_geometry]
    same_step_outputs: [salinity, salinity_source_count]
    next_step_restart_behavior: >-
      Salinity is static external input for a case and feeds every DIFFUCO
      mangrove-control call; it is not inferred from process state.
    microcase: [tests/unit/test_driver_static_helpers.py::test_bbox_center_mean_can_use_fortran_nearest_fallback_for_empty_targets]
    validation_evidence: [tests/parity/test_driver_1961_server_trace_boundary.py::test_local_salinity_and_tide_files_match_slowproc_bbox_trace_with_traced_geometry]
    status: verified

  - id: driver.active.tide_bbox
    module: DRIVER
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/slowproc.f90
    fortran_subroutine: slowproc_read_data
    fortran_lines: 6029-6297
    condition: >-
      Fixed READ_TIDE=y and TIDES=y; every landpoint maps all ITIMETIDE slots
      with the source bbox mean/fallback rule, then model time selects the tide
      height and change used by DIFFUCO and HYDROL.
    reachability: active
    kernel: jax_orchidee.driver.static.read_paper_salinity_tide_static_fields
    production_caller: jax_orchidee.driver.orchestration.paper_1961_driver_cold_start_multiday_modelout_lite_run
    state_inputs: [landpoint_lalo, landpoint_resolution, tide_file, tide_grid_geometry, itimetide, model_tstep]
    same_step_outputs: [tide_height_sequence, tide_source_count, current_tide_height, tide_height_change]
    next_step_restart_behavior: >-
      The immutable tide sequence stays in prepared context; only the model
      time index and HYDROL above-surface reservoirs advance between steps.
    microcase: [tests/unit/test_driver_static_helpers.py::test_bbox_center_mean_nearest_fallback_preserves_trailing_time_axis]
    validation_evidence: [tests/parity/test_driver_1961_server_trace_boundary.py::test_local_salinity_and_tide_files_match_slowproc_bbox_trace_with_traced_geometry]
    status: verified

  - id: slowproc.active.daily_surface_writeback
    module: SLOWPROC
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/slowproc.f90
    fortran_subroutine: slowproc_main
    fortran_lines: 653-663,1076-1129
    condition: >-
      LastTsDay selects the daily branch. STOMATE-updated PFT14 LAI and cover
      pass through slowproc_veget, qsintmax is recomputed, and tot_bare_soil
      is always derived; non-daily half-hours preserve the surface state.
    reachability: active
    kernel: jax_orchidee.sechiba.slowproc.slowproc_surface_transition_explicit
    production_caller: jax_orchidee.driver.orchestration.paper_1961_driver_cold_start_multiday_modelout_lite_run
    state_inputs: [do_slow, lai, frac_nobio, veget_max, veget, soiltile, stomate_daily_state]
    same_step_outputs: [lai, veget_max, veget, soiltile, qsintmax, tot_bare_soil]
    next_step_restart_behavior: >-
      Day-end surface fields are written to the shared SLOWPROC/STOMATE state
      and mirrored to the next DIFFUCO packet; non-daily calls carry the prior
      fields exactly.
    microcase:
      - tests/unit/test_sechiba_slowproc_time_gate_reachable.py::test_slowproc_non_daily_step_preserves_landpoint_surface_state
      - tests/unit/test_slowproc.py::test_slowproc_surface_update_explicit_returns_post_stomate_surface_boundary
    validation_evidence:
      - tests/parity/test_driver_1961_orchestration.py::test_day_end_packet_carries_active_ok_leak_restart_state_fields
    status: verified

  - id: routing.active.paper_single_landpoint_zero_branch
    module: ROUTING
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/sechiba.f90
    fortran_subroutine: sechiba_main
    fortran_lines: 1227-1262
    condition: >-
      Each of the 669 paper executions has nbp_glo=1. Therefore the fixed
      RIVER_ROUTING=y switch still selects the source no-routing branch and
      zeroes routing reservoirs, fluxes, deposition, and flood fractions.
    reachability: active
    kernel: jax_orchidee.sechiba.routing.routing_zero_outputs
    production_caller: jax_orchidee.driver.orchestration.paper_1961_next_step_runtime_result
    state_inputs: [river_routing, nbp_glo, nflow, nctext, ncarb]
    same_step_outputs: [riverflow, coastalflow, returnflow, reinfiltration, irrigation, sed_deposition, poc_deposition, flood_frac, stream_frac, flood_res, fastr]
    next_step_restart_behavior: >-
      Zero routing fields enter the same-step STOMATE OK_LEAK boundary and are
      recreated by the source branch each step; no multi-point routing memory
      is invented for independent one-landpoint paper cases.
    microcase:
      - tests/unit/test_coupled.py::test_stomate_static_routing_single_point_with_routing_switch_still_takes_no_routing_branch
    validation_evidence:
      - tests/unit/test_stomate_entry.py::test_no_routing_entry_source_reduces_stomate_payload_routing_gaps
    status: verified

  - id: restart.active.day_and_year_handoff
    module: RESTART
    fortran_file: fortran_source/ORCHIDEE/src_stomate/stomate_io.f90
    fortran_subroutine: writerestart
    fortran_lines: 2200-2948
    condition: >-
      Every completed day writes carried SECHIBA and STOMATE state; the final
      day of a noleap year becomes the first-step input of the next year
      without re-running cold-start initialization.
    reachability: active
    kernel: jax_orchidee.driver.orchestration._paper_day_end_state_packet
    production_caller: jax_orchidee.driver.orchestration.paper_1961_driver_restart_year_start_day_result
    state_inputs: [last_half_hour_state, stomate_day_state, daily_accumulators, season_memory, hydrol_state, thermosoil_state]
    same_step_outputs: [day_end_state_packet, sechiba_component_state, stomate_component_state]
    next_step_restart_behavior: >-
      Dynamic process fields replace their prior values, static inputs remain
      shared, daily accumulators reset at the source boundary, and year handoff
      rebases only counters rather than fabricating state.
    microcase:
      - tests/parity/test_driver_1961_orchestration.py::test_day_end_packet_carries_active_ok_leak_restart_state_fields
    validation_evidence:
      - tests/parity/test_driver_1961_orchestration.py::test_multiday_lite_end_state_satisfies_year_handoff_contract_and_rebases_counter
    status: verified

  - id: modelout.active.paper_history_formula
    module: MODELOUT
    fortran_file: fortran_source/ORCHIDEE/src_stomate/stomate_lpj.f90
    fortran_subroutine: StomateLpj
    fortran_lines: 1677-1699,2200-2246
    condition: >-
      Daily PFT14 biomass, GPP, and NPP fields are sent to yearly STOMATE
      history; the paper post-processing formula selects PFT14 and derives AGB
      and BGB from the named carbon pools.
    reachability: active
    kernel: jax_orchidee.stomate.modelout.compute_modelout_from_fields
    production_caller: jax_orchidee.driver.orchestration._driver_modelout_from_outputs
    state_inputs: [biomass, gpp_daily, npp_daily, yearly_average_contract]
    same_step_outputs: [LEAF_M, SAP_M_AB, HEART_M_AB, AGR_SAP_ST_M, AGR_HRT_ST_M, AGR_SAP_PN_M, AGR_HRT_PN_M, SAP_M_BE, HEART_M_BE, ROOT_M, GPP, NPP, AGB_model, BGB_model]
    next_step_restart_behavior: >-
      Modelout is diagnostic and does not feed prognostic state. The yearly
      average follows the XIOS/history operation and remains separate from
      restart writeback.
    microcase:
      - tests/unit/test_stomate_modelout.py::test_stomate_lpj_history_fields_from_state_feeds_paper_modelout_formula
    validation_evidence:
      - tests/parity/test_stomate_local_closure.py::test_real_history_modelout_formula_closes_for_first_and_last_years
      - tests/parity/test_stomate_pft14_parameters_modelout.py::test_modelout_formula_mapper_matches_paper_script_formula_for_arrays
    status: verified

  - id: sechiba.active.module_order
    module: SECHIBA
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/sechiba.f90
    fortran_subroutine: sechiba_main
    fortran_lines: 984-1216
    condition: >-
      HYDROL_CWRR=y and STOMATE_OK_STOMATE=y; execute DIFFUCO, ENERBIL,
      HYDROL, CONDVEG, THERMOSOIL, then SLOWPROC in source order.
    reachability: active
    kernel: jax_orchidee.sechiba.sechiba_step.sechiba_explicit_coupled_step_from_local_diffuco
    production_caller: jax_orchidee.driver.orchestration.paper_1961_next_step_runtime_result
    state_inputs: [previous_step_state, forcing, static_context, diffuco_local]
    same_step_outputs: [enerbil, hydrol, condveg, thermosoil]
    next_step_restart_behavior: >-
      driver_previous_step_state_from_timestep_scaffold stores component
      outputs for the next half-hour; year handoff rebases the same packet.
    microcase: [tests/unit/test_sechiba_step.py::test_sechiba_explicit_coupled_step_from_local_diffuco_matches_payload_entrypoint]
    validation_evidence: [tests/unit/test_sechiba_step.py::test_sechiba_explicit_coupled_step_runs_current_local_chain_in_source_order]
    status: verified

  - id: diffuco.active.co2_fvcb
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_trans_co2
    fortran_lines: 2018-2969
    condition: >-
      ok_co2 and veget_max(:,14)>min_sechiba and lai(:,14)>0 with illuminated
      canopy layers; PFT14 is C3.
    reachability: active
    kernel: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    production_caller: jax_orchidee.driver.orchestration.paper_1961_next_step_runtime_result
    state_inputs: [lai, veget, veget_max, humrel, rprof, vbeta3, atmospheric_forcing, pft_parameters]
    same_step_outputs: [gpp, gsmean, cimean, rveget, rstruct, vbeta3, vbeta3pot]
    next_step_restart_behavior: >-
      GPP enters the same-step STOMATE accumulator; DIFFUCO control memories
      and aerodynamic surface fields are carried in the driver state packet.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_pft14_local_process_boundary_runs_drag_qsatt_and_beta_chain_in_source_order]
    validation_evidence: [tests/unit/test_diffuco.py::test_server_1961_diffuco_trans_co2_pft14_first_active_record_matches_fortran_trace]
    status: verified

  - id: diffuco.active.mangrove_controls
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_main
    fortran_lines: 445-622
    condition: >-
      jv=14; salinity and tide_height modify control_salinity and
      control_inudate before the CO2 assimilation path.
    reachability: active
    kernel: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    production_caller: jax_orchidee.driver.orchestration.paper_1961_next_step_runtime_result
    state_inputs: [salinity, tide_height, biomass, rprof, diaglev, saved_control_salinity, saved_control_inudate]
    same_step_outputs: [control_salinity, control_inudate, controlled_gpp, controlled_cimean]
    next_step_restart_behavior: >-
      Updated salinity and inundation controls are saved explicitly and become
      the next DIFFUCO precall control state, including restart-year step one.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_pft14_c3_beta_process_chain_matches_manual_source_order_chain]
    validation_evidence: [tests/unit/test_diffuco.py::test_server_1961_diffuco_pft14_active_main_beta_closure_matches_after_main_trace]
    status: verified

  - id: diffuco.active.aerodynamic_boundary
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_aero
    fortran_lines: 940-1144
    condition: >-
      Every half-hour with fixed ROUGH_DYN=y; current wind and CONDVEG
      roughness determine grid and PFT drag coefficients and aerodynamic
      resistance before all beta and assimilation calculations.
    reachability: active
    kernel: jax_orchidee.sechiba.diffuco.diffuco_aero_explicit
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [u, v, zlev, z0m, z0h, roughheight, roughheight_pft, temp_sol, temp_sol_pft, temp_air, pb, rough_dyn]
    same_step_outputs: [q_cdrag, q_cdrag_pft, raero]
    next_step_restart_behavior: >-
      Current drag fields feed same-step snow, interception, flood, FvCB, and
      ENERBIL; dynamic roughness is carried from CONDVEG for the next call.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_aero_explicit_rough_dyn_disables_snowfact_like_paper_config]
    validation_evidence: [tests/unit/test_diffuco.py::test_diffuco_pft14_local_process_boundary_runs_drag_qsatt_and_beta_chain_in_source_order]
    status: verified

  - id: diffuco.conditional.snow_sublimation
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_snow
    fortran_lines: 1177-1281
    condition: >-
      Nonzero vegetation or nobio snow fraction under undersaturated air;
      forcing and explicit-snow state select storage-limited sublimation.
    reachability: conditional
    kernel: jax_orchidee.sechiba.diffuco.diffuco_snow_beta_explicit
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [qair, qsatt, rau, u, v, q_cdrag, snow, snow_nobio, frac_snow_veg, frac_snow_nobio, dt_sechiba]
    same_step_outputs: [vbeta1, sublimation_limit]
    next_step_restart_behavior: >-
      vbeta1 feeds same-step ENERBIL evaporation partition; HYDROL writes the
      resulting snow storage for the next half-hour.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_snow_beta_explicit_matches_fortran_snow_and_nobio_limiters]
    validation_evidence: [tests/unit/test_diffuco.py::test_diffuco_pft14_beta_process_chain_can_compute_qsatt_from_temp_sol_and_pb]
    status: verified

  - id: diffuco.conditional.canopy_interception
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_inter
    fortran_lines: 1426-1553
    condition: >-
      PFT14 veget is active and carried qsintveg is positive; current humidity,
      wind, canopy capacity, and resistance split intercepted-water evaporation
      from the residual wetted-foliage transpiration coefficient.
    reachability: conditional
    kernel: jax_orchidee.sechiba.diffuco.diffuco_inter_explicit
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [qair, qsatt, rau, u, v, q_cdrag, q_cdrag_pft, humrel, veget, qsintveg, qsintmax, rstruct]
    same_step_outputs: [vbeta2, vbeta23]
    next_step_restart_behavior: >-
      The beta split feeds same-step FvCB/ENERBIL; HYDROL updates qsintveg and
      SLOWPROC updates qsintmax for the following half-hour.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_pft14_c3_beta_process_chain_matches_manual_source_order_chain]
    validation_evidence: [tests/unit/test_diffuco.py::test_diffuco_pft14_local_process_boundary_runs_drag_qsatt_and_beta_chain_in_source_order]
    status: verified

  - id: diffuco.active.cwrr_bare_soil
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_bare
    fortran_lines: 1593-1690
    condition: >-
      Fixed HYDROL_CWRR=y; HYDROL evap_bare_lim and the uncovered fraction of
      PFT14/bare soil limit grid and PFT bare-soil evaporation beta.
    reachability: active
    kernel: jax_orchidee.sechiba.diffuco.diffuco_bare_cwrr_beta
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [evap_bare_lim, vbeta2, vbeta3, veget_max]
    same_step_outputs: [vbeta4, vbeta4_pft]
    next_step_restart_behavior: >-
      Bare beta feeds same-step ENERBIL; the scalar HYDROL evaporation limit
      is carried and recomputed from prognostic soil moisture.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_bare_cwrr_beta_uses_scalar_hydrol_evap_bare_lim]
    validation_evidence: [tests/unit/test_diffuco.py::test_diffuco_pft14_c3_beta_closure_chains_trans_bare_and_comb_no_dew]
    status: verified

  - id: diffuco.conditional.dew_freezing_combination
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_comb
    fortran_lines: 3070-3271
    condition: >-
      Humidity and surface/air temperature may select warm dew, freezing dew,
      vegetation, snow, or ordinary evaporation assembly for any PFT14 point.
    reachability: conditional
    kernel: jax_orchidee.sechiba.diffuco.diffuco_comb_explicit
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [qair, qsatt, temp_sol, temp_air, snow, veget, veget_max, lai, tot_bare_soil, vbeta1, vbeta2, vbeta3, vbeta4, vbeta4_pft, qsintmax]
    same_step_outputs: [vbeta, vbeta_pft, valpha, vbeta1, vbeta2, vbeta3, vbeta4, vbeta4_pft]
    next_step_restart_behavior: >-
      Final beta fields feed same-step ENERBIL; dew routed to snow or canopy is
      reflected in HYDROL prognostic storage before the next call.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_comb_explicit_freezing_dew_routes_to_snow_beta]
    validation_evidence: [tests/unit/test_diffuco.py::test_diffuco_pft14_payload_exports_comb_vbeta4_after_warm_dew_rewrite]
    status: verified

  - id: diffuco.inactive.single_point_flood_beta
    module: DIFFUCO
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/diffuco.f90
    fortran_subroutine: diffuco_flood
    fortran_lines: 1301-1356
    condition: >-
      The source call is unconditional, but the paper's independent
      nbp_glo=1 no-routing branch supplies flood_frac=flood_res=0. No forcing
      or continuous PFT14 parameter can make vbeta5 nonzero in this workflow.
    reachability: inactive
    kernel: jax_orchidee.sechiba.diffuco.diffuco_flood_beta_explicit
    production_caller: jax_orchidee.sechiba.diffuco.diffuco_pft14_local_process_boundary_explicit
    state_inputs: [flood_frac, flood_res, atmospheric_state, drag]
    same_step_outputs: [zero_vbeta5]
    next_step_restart_behavior: >-
      The no-routing branch recreates zero flood state every step. A local
      nonzero flood micro-case is retained only for a promoted routing workflow.
    microcase: [tests/unit/test_diffuco.py::test_diffuco_flood_beta_explicit_matches_fortran_flood_limiter]
    validation_evidence: [tests/unit/test_coupled.py::test_stomate_static_routing_single_point_with_routing_switch_still_takes_no_routing_branch]
    status: verified

  - id: enerbil.active.surface_energy
    module: ENERBIL
    fortran_file: fortran_source/ORCHIDEE/src_sechiba/enerbil.f90
    fortran_subroutine: enerbil_main
    fortran_lines: 390-598
    condition: >-
      Every SECHIBA timestep after DIFFUCO; use current turbulent beta fields,
      atmospheric forcing, and previous thermal recurrence state.
    reachability: active
    kernel: jax_orchidee.sechiba.enerbil.enerbil_explicit_local_step
    production_caller: jax_orchidee.sechiba.sechiba_step.sechiba_explicit_coupled_step
    state_inputs: [temp_sol, qsurf, emis, cgrnd, dgrnd, soilcap, soilflx, swnet, lwdown, diffuco_beta_fields]
    same_step_outputs: [temp_sol_new, qsurf, evapot, evapot_corr, transpir, vevapnu, vevapsno, pgflux, temp_sol_add]
    next_step_restart_behavior: >-
      Surface temperature and humidity are carried to the next step; evaporation
      fluxes feed same-step HYDROL and thermal fluxes feed THERMOSOIL recurrence.
    microcase: [tests/unit/test_enerbil.py::test_enerbil_explicit_local_step_orders_closed_kernels_without_sourcing_inputs]
    validation_evidence: [tests/unit/test_enerbil.py::test_active_enerbil_server_bridge_assembly_matches_fortran_active_trace_outputs]
    status: verified

  - id: enerbil.conditional.potential_temperature
    module: ENERBIL
