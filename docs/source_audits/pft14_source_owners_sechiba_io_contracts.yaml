schema_version: 1
scope: >-
  Source-routed ownership for all 26 typed setvar procedures in sechiba_io.f90
  and sechiba_io_p.f90. The arm totals follow the static branch ledger: 68
  serial arms and 74 parallel arms, 142 total. The root/non-root allocation
  arm in i11setvar_p is retained; the root-only getin call detail remains
  infrastructure beneath the explicit gather/root-read/scatter boundary.

totals:
  procedures: 26
  arms: 142
  sechiba_io_arms: 68
  sechiba_io_p_arms: 74

contracts:
  dispatch: >-
    Integer/real type and scalar/rank-1/rank-2/rank-3 signatures match the two
    Fortran generic interfaces. Unsupported combinations are rejected.
  assignment: >-
    Assignment occurs only when every target element equals val_exp. Scalar
    assignment is restricted to the declared *0 variants; equal-rank array
    assignment requires exact shape. i21/r21 preserve source SPREAD dimensions,
    axis precedence, and copy counts and reject nonconformable results.
  keyword: >-
    NO_KEYWORD and NOKEYWORD use the source's case-sensitive substring test.
    Other keys require an explicit ConfigurationReader; no final payload or
    guessed default is accepted by an owner procedure.
  parallel: >-
    OPTIONAL is_grid presence is distinct from its logical value. The only
    procedure that reads it, i11setvar_p, routes a present argument through an
    explicit gather, root getin, scatter backend. Boundary index order remains
    Fortran one-based. Optional declarations unused by source remain semantic
    no-ops in i21setvar_p, i22setvar_p, r11setvar_p, and r21setvar_p.

