# this source-audit asset deliberately: the audit must validate declarations,
# not manufacture successful lifecycle stages in Python.
mask_contract_groups:
  npts:
    compressed_land_domain:
      fields: [carb_mass_total, fpeat, thawed_humidity, depth_organic_soil, t2m_longterm, t2m_month, t2m_week, tseason, tseason_length, tseason_tmp, gdd0_lastyear, gdd0_thisyear, precip_lastyear, precip_thisyear, litterhum_daily, t2m_daily, t2m_min_daily, t2m_max_daily, wspeed_daily, tsurf_daily, precip_daily, snowfall_daily, snowmass_daily, tmc_topgrass_daily, fwet_daily, liqwt_daily, temp_growth, tot_bare_soil, totfrac_nobio, ni_acc, tsurf_year, height_acro, fwet_month, liqwt_month, liqwt_max, delta_fsave, t2m_14, after_snow, after_wet, wet1day, wet2day, nbp_sum, nbp_flux, ok_equilibrium, gpp_daily, npp_daily, resp_maint, resp_growth, age, sla_calc, pft_present, ind, adapted, regenerate, npp_longterm, lm_lastyearmax, turnover_time, senescence, when_growthinit, co2_to_bm, veget_lastlight, everywhere, need_adjacent, rip_time, altmax, fixed_cryoturbation_depth, lignin_struc_above, moiavail_month, moiavail_week, gdd_m5_dormance, gdd_from_growthinit, gdd_midwinter, ncd_dormance, ngd_minus5, time_hum_min, hum_min_dormance, tmin_spring_time, begin_leaves, onset_date, gpp_week, maxmoiavail_lastyear, maxmoiavail_thisyear, minmoiavail_lastyear, minmoiavail_thisyear, maxgppweek_lastyear, maxgppweek_thisyear, maxfpc_lastyear, maxfpc_thisyear, lm_thisyearmax, humrel_daily, cn_ind, lai, veget, veget_max, fireindex, firelitter, resp_hetero, co2_fire, carbon_acro, carbon_cato, depth_deepsoil, wshtotsum, sr_ugb, nb_ani, grazed_frac, import_yield, nb_grazingdays, height, frac_age, tsoil_month, soilhum_month, tsoil_daily, soilhum_daily, gdd_init_date, resp_maint_part, biomass, turnover_daily, turnover_longterm, bm_to_litter, leaf_age, leaf_frac, litterpart, dead_leaves, carbon, carbon_save, litter, lignin_struc, fuel_1hr, fuel_10hr, fuel_100hr, fuel_1000hr, prod10, prod100, flux10, flux100, assim_param, litter_above, litter_below, carbon_32l, DOC, interception_storage, lignin_struc_below, deepC_a, deepC_s, deepC_p, soilc_total, O2_soil, CH4_soil, deepC_peat, O2_snow, CH4_snow, uo_0, uold2_0, uo_wet1, uold2_wet1, uo_wet2, uold2_wet2, uo_wet3, uold2_wet3, uo_wet4, uold2_wet4, fwet_series, deepC_a_save, deepC_s_save, deepC_p_save, litter_not_avail, MatrixV, Vector_U, previous_stock, current_stock, prod10_total, prod100_total, frac_nobio, soiltile]
      mode: compressed_land_domain
      applicability: npts is the local compressed landpoint domain indexed by index_g, not a latitude-longitude raster
      inactive_write_behavior: no ocean/non-land slots exist in this array; gather/scatter preserves only index_g land entries
      owner: jax_orchidee.stomate.restart_io.read_stomate_readstart_states_from_template
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate_io.f90
        subroutine: readstart/writerestart
        lines: 170-256, 1761-1960
  nvm:
    pftpresent_state:
      fields: [age, sla_calc, pft_present, ind, adapted, regenerate, npp_longterm, lm_lastyearmax, turnover_time, senescence, when_growthinit, co2_to_bm, everywhere, need_adjacent, rip_time, begin_leaves, cn_ind, biomass, turnover_daily, turnover_longterm, bm_to_litter, leaf_age, leaf_frac]
      mode: PFTpresent
      applicability: demographic state is updated where the source PFTpresent/prescribe logic admits the PFT slot
      inactive_write_behavior: preserve source restart/carry values until prescribe explicitly creates or removes the PFT
      owner: jax_orchidee.stomate.carbon_kernels.prescribe_step
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate_prescribe.f90
        subroutine: prescribe
        lines: 126-248
    crown_tree_state:
      fields: [height]
      mode: PFTpresent
      applicability: crown updates height only for present natural tree PFT slots with wood mass above min_stomate
      inactive_write_behavior: retain the incoming height for bare, absent, grass, and sub-threshold tree slots
      owner: jax_orchidee.stomate.carbon_kernels.crown_step
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/lpj_crown.f90
        subroutine: crown
        lines: 78-201
    lai_map_leaf_fraction_state:
      fields: [frac_age]
      mode: veget_mask_2d
      applicability: with paper LAI_MAP=false, every landpoint/PFT/leaf-age slot receives the final leaf_frac value at the daily boundary
      inactive_write_behavior: exact leaf_frac copy includes zero-valued inactive PFT and leaf-age slots; no stale frac_age carry is permitted
      owner: jax_orchidee.driver.orchestration._paper_day_first_stomate_state_packet
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate.f90
        subroutine: stomate_main
        lines: 4201-4218
    vegetated_flux_state:
      fields: [gpp_daily, npp_daily, resp_maint, resp_growth, veget_lastlight, moiavail_month, moiavail_week, gdd_m5_dormance, gdd_from_growthinit, gdd_midwinter, ncd_dormance, ngd_minus5, time_hum_min, hum_min_dormance, tmin_spring_time, onset_date, gpp_week, maxmoiavail_lastyear, maxmoiavail_thisyear, minmoiavail_lastyear, minmoiavail_thisyear, maxgppweek_lastyear, maxgppweek_thisyear, maxfpc_lastyear, maxfpc_thisyear, lm_thisyearmax, humrel_daily, lai, veget, veget_max, resp_hetero, co2_fire, resp_maint_part]
      mode: veget_mask_2d
      applicability: process updates are masked by source vegetation cover and active-PFT state at each landpoint
      inactive_write_behavior: retain source-backed state or process-defined zero only where the owner applies the same vegetation mask
      owner: jax_orchidee.driver.orchestration._paper_day_first_stomate_state_packet
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate.f90
        subroutine: stomate_main
        lines: 3187-4364
    peat_permafrost_state:
      fields: [altmax, fixed_cryoturbation_depth, carbon_acro, carbon_cato, depth_deepsoil, deepC_a, deepC_s, deepC_p, soilc_total, O2_soil, CH4_soil, deepC_peat, O2_snow, CH4_snow]
      mode: is_peat_or_permafrost
      applicability: peat/permafrost process masks and vertical-domain switches determine active PFT slots
      inactive_write_behavior: preserve the exact guarded source carry when the peat/permafrost process is disabled
      owner: jax_orchidee.driver.orchestration.paper_day_active_restart_producer_fields
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate.f90
        subroutine: stomate_main
        lines: 3288-3742
    all_slots_state:
      fields: [lignin_struc_above, fireindex, firelitter, wshtotsum, sr_ugb, nb_ani, grazed_frac, import_yield, nb_grazingdays, litterpart, dead_leaves, carbon, carbon_save, litter, lignin_struc, fuel_1hr, fuel_10hr, fuel_100hr, fuel_1000hr, assim_param, litter_above, litter_below, carbon_32l, DOC, interception_storage, lignin_struc_below, litter_not_avail, MatrixV, Vector_U, previous_stock, current_stock]
      mode: all_slots_state
      applicability: restart storage spans every configured nvm slot; branch-specific owners decide whether a slot changes
      inactive_write_behavior: preserve the source-backed slot unless an explicit process owner overwrites it
      owner: jax_orchidee.stomate.restart_io.read_stomate_readstart_states_from_template
      fortran_provenance:
        file: fortran_source/ORCHIDEE/src_stomate/stomate_io.f90
        subroutine: readstart/writerestart
        lines: 170-256, 1761-1960

disposition_contracts:
  restart_variable:
    serialization: fortran_restart_variable
    read_owner: jax_orchidee.stomate.restart_io.read_stomate_readstart_states_from_template
    day_start_owner: jax_orchidee.driver.orchestration.DriverFirstDayStomateStatePacket
    day_end_owner: jax_orchidee.driver.orchestration._paper_day_end_state_packet
    write_owner: jax_orchidee.stomate.restart_io.write_stomate_full_writerestart_states_from_template
    next_read_owner: jax_orchidee.stomate.restart_io.read_stomate_readstart_states_from_template
    freshness_contract:
      step_behavior: overwritten by the source-routed production owner or retained only by an explicit source-backed guard
      guarded_carry_source: fixed_path_carry_fields
      cross_step: day-end packet becomes the next step/day start state
      cross_year: serialized restart value is read at the next model start
  derived:
    serialization: not_serialized_recomputed
    freshness_contract:
      step_behavior: recomputed from declared source inputs at the declared recompute point
      cross_step: consumers receive the recomputed value; no independent carry authority
      cross_year: recomputed after restart inputs are read
  runtime_only:
    serialization: not_serialized_runtime
    freshness_contract:
      step_behavior: initialized and updated by declared executable owners
      cross_step: runtime owner returns the next accumulator state
      cross_year: initialized from new-run forcing; no restart value is read or written
  source_local_control:
    serialization: not_serialized_source_local
    freshness_contract:
      step_behavior: read and consumed locally by the declared owner
      cross_step: no scientific state carry
      cross_year: re-evaluated by restart read logic; no restart value is written
  packet_only:
    serialization: not_serialized_packet
    freshness_contract:
      step_behavior: produced and consumed through the declared packet owners
      cross_step: field-specific packet disposition
      cross_year: field-specific packet disposition

# Canonical fields assembled from several restart variables or derived after
# reading. Source aliases are resolved before lifecycle classification.
source_aliases:
  pft_present: [PFTpresent]
  rip_time: [RIP_time]
  co2_to_bm: [co2_to_bm_dgvm]
  resp_maint_part: [maint_resp]
  lignin_struc_below: [lig_struc_be]
  fixed_cryoturbation_depth: [fixed_cryoturb_depth]
  carbon_32l: [carbon_32l_a, carbon_32l_s, carbon_32l_p]
  DOC: [freedoc, adsdoc]
  dt_days_read: [dt_days]
  humrel_daily: [moiavail_daily]
  tseason: [Tseason]
  tseason_length: [Tseason_length]
  tseason_tmp: [Tseason_tmp]
  tmin_spring_time: [Tmin_spring_time]
  maxmoiavail_lastyear: [maxmoistr_last]
  maxmoiavail_thisyear: [maxmoistr_this]
  minmoiavail_lastyear: [minmoistr_last]
  minmoiavail_thisyear: [minmoistr_this]

# ``stomate_io`` exposes the restart variable as ``resp_hetero``, but the
# caller passes the SAVE daily accumulator ``resp_hetero_d``.  It must never
# be confused with an instantaneous heterotrophic-respiration diagnostic.
restart_field_contracts:
  resp_hetero:
    fortran_state_symbol: resp_hetero_d
    restart_variable_name: resp_hetero
    update_owner: jax_orchidee.driver.orchestration._paper_day_first_stomate_state_packet
    fortran_provenance:
      file: fortran_source/ORCHIDEE/src_stomate/stomate.f90
      subroutine: stomate_main
      lines: 294-296, 3364-3648, 4958, 5467

# Every restart field must occur in exactly one group below or in
# fixed_path_carry_fields.  There is deliberately no default update mode.
restart_update_groups:
  daily_packet_literal:
    disposition: production_overwrite
    owner: jax_orchidee.driver.orchestration._paper_day_first_stomate_state_packet
    ast_mapping_names: [fields]
    fields: [DOC, adapted, age, altmax, assim_param, begin_leaves, biomass, bm_to_litter, carb_mass_total, carbon_32l, co2_to_bm, dead_leaves, everywhere, fixed_cryoturbation_depth, fuel_1000hr, fuel_100hr, fuel_10hr, fuel_1hr, gdd_init_date, gpp_daily, ind, interception_storage, leaf_age, leaf_frac, lignin_struc_above, lignin_struc_below, litter_above, litter_below, litterpart, npp_daily, npp_longterm, pft_present, regenerate, resp_growth, resp_maint, resp_maint_part, rip_time, senescence, sla_calc, turnover_daily, turnover_time, when_growthinit]
  active_restart_producers:
    disposition: production_overwrite
    owner: jax_orchidee.driver.orchestration.paper_day_active_restart_producer_fields
    ast_mapping_names: [$return]
    fields: [dt_days_read, resp_hetero, deepC_peat, depth_deepsoil]
  daily_accumulator_outputs:
    disposition: production_overwrite
    owner: jax_orchidee.stomate.daily.stomate_first_step_daily_accumulation_from_entry
    ast_mapping_names: [current, increments, fields]
    fields: [fwet_daily, humrel_daily, liqwt_daily, litterhum_daily, precip_daily, soilhum_daily, t2m_daily, t2m_max_daily, t2m_min_daily, tsoil_daily, tsurf_daily, wspeed_daily]
  season_outputs:
    disposition: production_overwrite
    owner: jax_orchidee.driver.orchestration._paper_day_season_fields_from_bundle_source
    ast_mapping_names: [fields]
    ast_dynamic_constants: [STOMATE_DAY_SEASON_MEMORY_FIELDS, STOMATE_DAY_SEASON_ANNUAL_FIELDS, STOMATE_DAY_SEASON_BIOMETEOROLOGY_FIELDS]
    fields: [gdd0_lastyear, gdd0_thisyear, gdd_from_growthinit, gdd_m5_dormance, gdd_midwinter, gpp_week, hum_min_dormance, lm_lastyearmax, lm_thisyearmax, maxfpc_lastyear, maxfpc_thisyear, maxgppweek_lastyear, maxgppweek_thisyear, maxmoiavail_lastyear, maxmoiavail_thisyear, minmoiavail_lastyear, minmoiavail_thisyear, moiavail_month, moiavail_week, ncd_dormance, ngd_minus5, onset_date, precip_lastyear, precip_thisyear, soilhum_month, t2m_14, t2m_longterm, t2m_month, t2m_week, tau_longterm, time_hum_min, tmin_spring_time, tseason, tseason_length, tseason_tmp, tsoil_month, tsurf_year, turnover_longterm]

# The existing line scanner cannot resolve a string literal placed on the
# continuation line after ``CALL restget_p &``. Keep the exception explicit
# and source-line-specific rather than silently attributing the previous
# ``var_name`` assignment.
source_line_overrides:
  lignin_struc_below:
    read_lines: [1530]
    write_lines: [2374]

