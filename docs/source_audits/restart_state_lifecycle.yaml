  derived: [source_inputs, executable_owner, recompute_point, explicitly_not_serialized]
  runtime_only: [initialization_owner, update_owner, explicitly_not_serialized]
  source_local_control: [read_owner, use_owner, explicitly_not_serialized]
  packet_only: [producer, consumer, day_start, update, day_end, cross_step, cross_year, explicitly_not_serialized]

restart_file_scope:
  protocol: paper production uses one independent landpoint per ORCHIDEE run
  netcdf_schema: docs/source_audits/stomate_restart_netcdf_schema.json
  writer: jax_orchidee.stomate.restart_io.write_stomate_full_writerestart_states
  scatter: Fortran one-based index_g is exactly [1] on the 1x1 physical grid
  validation: complete five-state read-write-read plus exact dimensions, variable order, dtype, metadata, chunking, and endian checks

known_global_gaps: []
