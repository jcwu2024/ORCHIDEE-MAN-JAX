schema_version: 2
scope:
  component: STOMATE
  jax_readers:
    - jax_orchidee.stomate.reference.StomateRestartEntryState
    - jax_orchidee.stomate.reference.StomateRestartSeasonState
    - jax_orchidee.stomate.reference.StomateDailyAccumulatorState
