    branch_cases:
      - id: canopy.zero_vegetation_no_rain
        ledger_entry: hydrol.conditional.canopy_interception
        fortran_lines: 5042-5110
        condition: vegtot <= min_sechiba, precip_rain = 0, and bare-soil PFT1
        expected_arm: no melt redistribution; PFT1 storage reset and ground precipitation assigned
        input_case: point 1 in inputs.json
        control_flow_arm_ids:
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5087:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5088:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5089:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5090:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5091:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5101:if:false
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5115:if:false
      - id: canopy.under_capacity_pft14
        ledger_entry: hydrol.conditional.canopy_interception
        fortran_lines: 5057-5110
        condition: active PFT14 canopy remains below qsintmax and vegtot > min_sechiba
        expected_arm: intercepted rain retained and melt redistributed by veget_max/vegtot
        input_case: point 2 in inputs.json
        control_flow_arm_ids:
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5101:if:true
      - id: canopy.overflow_pft14
        ledger_entry: hydrol.conditional.canopy_interception
        fortran_lines: 5061-5115
        condition: carried storage plus rain exceeds qsintmax after wet-canopy evaporation
        expected_arm: excess becomes canopy2ground and capped qsintveg is written back
        input_case: point 3 in inputs.json
        control_flow_arm_ids:
          - fortran_source/ORCHIDEE/src_sechiba/hydrol.f90:5101:if:true

