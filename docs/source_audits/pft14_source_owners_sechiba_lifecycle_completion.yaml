schema_version: 1
scope: >-
  Exact lifecycle/time/history completion ledger. This file owns 68 audited
  control-flow arms and does not replace the parent SECHIBA source-owner ledger.

totals:
  procedures: 5
  arms: 68
  ioipslctrl_history_arms: 42
  intersurf_time_arms: 10
  intersurf_initialize_2d_arms: 6
  intersurf_main_2d_arms: 6
  sechiba_finalize_arms: 4

contracts:
  transport: >-
    History handle creation and final restart serialization are explicit
    callbacks. Stream activation, frequency, history-level operations, grid
    layout, scientific feature selections, state masks, and values are resolved
    before either callback is invoked.
  two_dimensional_interface: >-
    Fortran one-based kindex compression, precipitation conversion to mass per
    model step, latitude/longitude ordering, shifted itau, undefined ocean
    fill, scatter, and water-flux conversion back to per-second units are owned.
  finalization: >-
    Component finalizers execute in source order. Hydrology/thermosoil and
    routing/no-routing branches own their exact writeback before slowproc,
    PFTs 2:nvm form netco2flux, and only then may restart transport run.

