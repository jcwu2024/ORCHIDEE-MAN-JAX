schema_version: 1
scope: >-
  Second-batch source owners for all 8 polygones.f90 procedures and all 3
  interregxy.f90 procedures. Arm counts include pft14_active and
  pft14_conditional dispositions from pft14_arm_dispositions_infrastructure;
  direct fatal-only outside_declared_workflow arms are represented by Python
  validation errors but are not included in the declared 139-arm total.

totals:
  procedures: 11
  arms: 139
  polygones_procedures: 8
  polygones_arms: 94
  interregxy_procedures: 3
  interregxy_arms: 45

contracts:
  polygon_order: >-
    Inputs are not canonicalized. Last-to-first edge traversal, closed input
    vertices, repeated points, first-MINLOC ties, repeated crossings, and
    convex-hull output order follow the Fortran loops.
  undefined_outputs: >-
    False line intersections return NaN coordinates because Fortran leaves
    point_x/point_y undefined. Unwritten aggregation index slots use INT32_MIN
    and unwritten internal overlap slots use NaN. The all-equal-x convex-hull
    branch raises FortranUndefinedOutputError because lines 571-573 RETURN
    before assigning nvert_out or poly_out.
  external_state: >-
    Grid_Toij, ilandindex/jlandindex, iim_g/jjm_g, and dxWRF/dyWRF are explicit
    Python inputs. neighbours, resolution, contfrac, mask, lon_cen, and lat_cen
    remain accepted but retain their source behavior of not being read.
  oracle: >-
    tests/unit/test_geometry_polygons.py embeds source-extracted gfortran
    pointinside, lineintersect, and area procedures and compiles them in the
    system temporary directory; interregxy findpoints is validated through
    analytic full-cell and half-cell overlap cases using the same polygon chain.

