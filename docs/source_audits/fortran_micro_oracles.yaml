schema_version: 2
manifest_name: fortran_micro_oracles
scope: >-
  Byte-exact extracts from original ORCHIDEE Fortran source, compiled inside
  a minimal dependency-stub harness and compared with the current JAX owner.
  Extract hashes prove process text provenance; comparison assets record the
  separately established numerical evidence and tolerances. GNU compilation
  uses -fdefault-real-8, the kind-policy equivalent of the paper executable's
  recorded Intel -i4 -r8 flags.
output_root: outputs/reference_mode/micro_oracles
oracles_initial: # Anchor preserves the original verified QSAT record during v2 migration.
  - &qsatcalc_record
    id: qsat_moisture.qsatcalc
    source_file: fortran_source/ORCHIDEE/src_sechiba/qsat_moisture.f90
    procedure: qsatcalc
    procedure_kind: subroutine
    start_line: 79
    end_line: 179
    expected_source_sha256: 3c898cb92bf4dcdc1f365b8ac3341b192a615c532317c1a260298a29e2503f6e
    expected_span_sha256: e2f88c9bb8a7faa186ff2119af3eab2e22521f2f90088168d7ed00cebf78a0bb
    dependencies:
      enclosing_module: qsat_moisture
      use_modules:
        - defprec
        - constantes
        - IOIPSL
        - constantes_soil
      module_symbols:
        - i_std
        - r_std
        - l_qsat_first
        - max_temp
        - min_temp
        - qsfrict
        - diag_qsat
        - numout
      called_procedures:
        - qsfrict_init
        - ipslerr_p
    compilation:
      status: passed
      standalone_compilable: false
      compiler_available: true
      compiler: C:\msys64\ucrt64\bin\gfortran.exe
      compiler_version: GNU Fortran (Rev5, Built by MSYS2 project) 16.1.0
      harness: scripts/dev/qsat_micro_oracle_harness.f90.template
      build_script: scripts/dev/build_qsat_micro_oracle.py
      run_script: scripts/dev/run_qsat_micro_oracle.py
      result_asset: outputs/reference_mode/micro_oracles/qsat_moisture/comparison.json
    numerical_oracle_status: verified
    tolerance: {rtol: 1.0e-12, atol: 1.0e-24}

