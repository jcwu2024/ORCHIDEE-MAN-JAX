schema_version: 1
scope: >-
  Third-batch ownership for interpol_help.f90 regular-grid overlap aggregation
  and its parallel wrappers. The 103 source-driven arms are 57 aggregate_2d,
  36 aggregate_vec, 5 aggregate_2d_p, and 5 aggregate_vec_p.

totals:
  procedures: 4
  arms: 103
  aggregate_2d_arms: 57
  aggregate_vec_arms: 36
  aggregate_2d_p_arms: 5
  aggregate_vec_p_arms: 5

contracts:
  overlap: >-
    Source and target regular lon/lat cells are rectangle polygons. Strict
    source interval tests, date-line transforms, source scan order, one-based
    slots, and metric area scaling follow interpol_help.f90. Polygon area is
    owned by geometry_polygons.polygones_area and is reused unchanged.
  mask_undef_weights: >-
    aggregate_2d accepts only mask==1 source cells. Unused slots preserve the
    Fortran index-zero/area-minus-one contract. Normalized weights include only
    positive overlap slots and an empty row remains all zero. contfrac remains
    an ABI input but is not read by either Fortran numerical core.
  parallel: >-
    Single-rank RegLonLat wrappers call the same aggregate core directly.
    Multi-rank gather/broadcast/scatter requires an explicit backend. RegXY
    delegates only with explicit projection and target geometry inputs.

